name: Keşif (geçici)

on:
  workflow_dispatch:
    inputs:
      komut:
        description: "Çalıştırılacak bash komutu (boşsa varsayılan keşif)"
        required: false

jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - name: Keşif
        env:
          KOMUT: ${{ inputs.komut }}
        run: |
          mkdir -p k && cd k
          UA="Mozilla/5.0"
          if [ -n "$KOMUT" ]; then bash -c "$KOMUT"; else
          curl -sS -A "$UA" -c jar -b jar -o sayfa.html "https://www.bddk.org.tr/BultenHaftalik/" -w "sayfa HTTP %{http_code} %{size_download}\n"
          grep -oE '(src|href)="[^"]+\.js[^"]*"' sayfa.html | sed -E 's/.*="([^"]+)"/\1/' | sort -u > js.txt
          cat js.txt
          i=0; while read -r u; do i=$((i+1)); case "$u" in http*) url="$u";; /*) url="https://www.bddk.org.tr$u";; *) url="https://www.bddk.org.tr/BultenHaftalik/$u";; esac
            curl -sS -A "$UA" -o "js_$i.js" "$url" -w "$url HTTP %{http_code} %{size_download}\n"; done < js.txt
          echo "===== FORM / SELECT / URL ====="
          grep -nE '<select|<option|<form|data-|url:|Url|ajax|\$\.post|\$\.get|fetch\(' sayfa.html | head -300
          echo "===== JS ENDPOINT ====="
          grep -hnoE '"/?(BultenHaftalik|bultenhaftalik)[^"]*"|/tr/Home/[A-Za-z]+|Home/[A-Za-z]+' js_*.js sayfa.html | sort | uniq -c | head -100
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: kesif
          path: k/
