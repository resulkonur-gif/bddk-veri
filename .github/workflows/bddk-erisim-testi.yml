name: BDDK erişim testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ana sayfa
        run: |
          curl -sS -o /dev/null -w "Ana sayfa: HTTP %{http_code}, %{size_download} bayt, %{time_total} sn\n" \
            -A "Mozilla/5.0" --max-time 60 "https://www.bddk.org.tr/BultenAylik/" || echo "Ana sayfa: BAĞLANTI HATASI"

      - name: Excel dışa aktarımı (Bilanço, 2026/9, Sektör, TL)
        run: |
          curl -sS -D headers.txt -o Bilanco_2026_9.xlsx \
            -w "Excel: HTTP %{http_code}, %{size_download} bayt, %{time_total} sn\n" \
            -A "Mozilla/5.0" --max-time 60 \
            "https://www.bddk.org.tr/BultenAylik/tr/Home/BasitExceleAktar?tabloNo=1&yil=2026&ay=9&paraBirimi=TL&taraf%5B0%5D=10001" \
            || echo "Excel: BAĞLANTI HATASI"
          grep -i content-disposition headers.txt || true
          file Bilanco_2026_9.xlsx || true

      - name: JSON uç noktası (Bilanço, 2026/9, Sektör, TL)
        run: |
          curl -sS -o rapor.json -w "JSON: HTTP %{http_code}, %{size_download} bayt\n" \
            -A "Mozilla/5.0" --max-time 60 \
            -d "tabloNo=1&yil=2026&ay=9&paraBirimi=TL&taraf=10001" \
            "https://www.bddk.org.tr/BultenAylik/tr/Home/BasitRaporGetir" || echo "JSON: BAĞLANTI HATASI"
          head -c 300 rapor.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bddk-test
          path: |
            Bilanco_2026_9.xlsx
            headers.txt
            rapor.json
          if-no-files-found: ignore
