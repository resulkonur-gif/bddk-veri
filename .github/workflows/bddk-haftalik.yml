name: BDDK Haftalık Bülten

on:
  schedule:
    # Her gün 10:13 (TR). Yeni hafta yoksa tek istekle biter.
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      baslangic:
        description: "Başlangıç yılı (ör. 2014). Boş bırakılırsa yalnızca yeni hafta kontrol edilir."
        required: false
      bitis:
        description: "Bitiş yılı (ör. 2026)"
        required: false

permissions:
  contents: write

concurrency:
  group: bddk-yazma
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Veriyi çek
        run: |
          if [ -n "${{ inputs.baslangic }}" ] && [ -n "${{ inputs.bitis }}" ]; then
            python scripts/bddk_haftalik.py --baslangic "${{ inputs.baslangic }}" --bitis "${{ inputs.bitis }}"
          else
            python scripts/bddk_haftalik.py --guncelle
          fi

      - name: Veri değiştiyse raporu üret
        run: |
          if [ -n "$(git status --porcelain veri/haftalik)" ] || [ ! -f docs/haftalik.html ]; then
            python scripts/rapor_haftalik_olustur.py
          fi

      - name: Değişiklik varsa gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/haftalik docs
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "BDDK haftalık veri: $(cat veri/haftalik/son_tarih.txt)"
            git pull --rebase origin main
            git push
          fi
