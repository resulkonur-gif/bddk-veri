name: yerel betik testi
on:
  push:
    branches: [yerel-test2]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: aylik + otomatik rapor
        shell: bash
        run: python -I yerel/bddk_indir.py aylik --baslangic 2026-07 --bitis 2026-09
      - name: menu 5
        shell: bash
        run: printf "5\n\n" | python -I yerel/bddk_indir.py | tail -5
      - name: kontrol
        shell: bash
        run: ls -la yerel/BDDK_Veri yerel/BDDK_Veri/aylik && grep -c "Chart.js v4.4.1" yerel/BDDK_Veri/BDDK_Aylik_Rapor.html && ! grep -q "cdnjs" yerel/BDDK_Veri/BDDK_Aylik_Rapor.html && echo "CDN bagimliligi yok"
