name: yerel betik testi
on:
  push:
    branches: [yerel-test2]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: haftalik + aylik + raporlar
        shell: bash
        run: |
          python -I yerel/bddk_indir.py haftalik --baslangic 2026 --bitis 2026 | grep -vE "satır$"
          python -I yerel/bddk_indir.py aylik | grep -vE " tamam$"
          printf "6\n\n" | python -I yerel/bddk_indir.py | tail -6
          ls -la yerel/BDDK_Veri
          grep -c "Chart.js v4.4.1" yerel/BDDK_Veri/BDDK_Haftalik_Rapor.html
          grep -o 'href="BDDK_[A-Za-z_]*.html"' yerel/BDDK_Veri/*.html | sort -u
