name: yerel betik testi
on:
  push:
    branches: [yerel-test2]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: paket olmadığını doğrula
        shell: bash
        run: python -c "import importlib.util as u; print('requests',u.find_spec('requests') is not None,'pandas',u.find_spec('pandas') is not None,'openpyxl',u.find_spec('openpyxl') is not None)"
      - name: haftalik
        shell: bash
        run: python -I yerel/bddk_indir.py haftalik --baslangic 2026 --bitis 2026
      - name: kontrol
        shell: bash
        env: {PYTHONIOENCODING: utf-8}
        run: |
          pip install -q openpyxl pandas
          python - <<'PY'
          import pandas as pd, glob, json
          from openpyxl import load_workbook



          pass # satir',len(a),'eslesen',len(m),'max fark',(m.deger-m.deger_r).abs().max(),'tablolar',sorted(a.tablo_no.unique()))
          h=pd.read_csv('yerel/BDDK_Veri/haftalik/bddk_haftalik_2026.csv',encoding='utf-8-sig',dtype={'tarih':str})
          rh=pd.read_csv('veri/haftalik/csv/bddk_haftalik_2026.csv',encoding='utf-8-sig',dtype={'tarih':str})
          meta=json.load(open('veri/haftalik/kalemler.json',encoding='utf-8'))
          sira={(int(n),k['id']):k['sira'] for n,t in meta.items() for k in t['kalemler']}
          rh['sira']=[sira[(t,k)] for t,k in zip(rh.tablo_no,rh.kalem_id)]
          mh=h.merge(rh,on=['tarih','tablo_no','grup','sira'],suffixes=('','_r'))
          print('HAFTALIK satir',len(h),'eslesen',len(mh),'yerelde olup arsivde olmayan',len(h)-len(mh))
          for c in ['TP','YP','Toplam']:
              mh['f_'+c]=(mh[c]-mh[c+'_r']).abs()
          mh['f']=mh[['f_TP','f_YP','f_Toplam']].max(axis=1)
          b=mh[mh.f>0.01]
          print('farkli satir',len(b)); print(b.groupby(['tablo_no','sira','kalem']).size().sort_values(ascending=False).head(15).to_string())
          print(b.sort_values('f',ascending=False)[['tarih','tablo_no','grup','sira','kalem','TP','TP_r','YP','YP_r','Toplam','Toplam_r']].head(8).to_string())
          for f in sorted(glob.glob('yerel/BDDK_Veri/*/*.xlsx')):
              wb=load_workbook(f,read_only=True); print(f.replace(chr(92),'/').split('/')[-1], [(ws.title, ws.max_row) for ws in wb.worksheets][:3])
          PY
